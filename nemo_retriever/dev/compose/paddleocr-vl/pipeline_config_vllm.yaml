pipeline_name: PaddleOCR-VL-1.6
batch_size: 1
use_queues: true
use_doc_preprocessor: false
use_layout_detection: true
use_chart_recognition: false
use_seal_recognition: false
format_block_content: false
merge_layout_blocks: true
layout_merge_bboxes_mode:
  0: union # abstract
  1: union # algorithm
  2: union # aside_text
  3: large # chart
  4: union # content
  5: large # display_formula
  6: large # doc_title
  7: union # figure_title
  8: union # footer
  9: union # footer_image
  10: union # footnote
  11: union # formula_number
  12: union # header
  13: union # header_image
  14: union # image
  15: large # inline_formula
  16: union # number
  17: large # paragraph_title
  18: union # reference
  19: union # reference_content
  20: union # seal
  21: union # table
  22: union # text
  23: union # text
  24: union # vision_footnote
markdown_ignore_labels:
  - number
  - footnote
  - header
  - header_image
  - footer
  - footer_image
  - aside_text

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayoutV3
    model_dir: null
    batch_size: 1
    threshold: 0.3
    layout_nms: true
    layout_unclip_ratio: [1.0, 1.0]
  VLRecognition:
    module_name: vl_recognition
    model_name: PaddleOCR-VL-1.6-0.9B
    model_dir: null
    batch_size: 1
    genai_config:
      backend: vllm-server
      server_url: http://paddleocr-vl-vlm-server:8080/v1
      max_concurrency: 1

Serving:
  visualize: false
  extra:
    max_num_input_imgs: 1
